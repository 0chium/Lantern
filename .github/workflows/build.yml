name: Build Lantern

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Lantern
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS toolchain
        run: |
          brew install ldid xz
          curl -LO https://github.com/theos/sdks/archive/master.tar.gz
          tar -xzf master.tar.gz
          mkdir -p "$HOME/theos/sdks"
          cp -R sdks-master/*.sdk "$HOME/theos/sdks/"

      - name: Build Lantern package
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1

      - name: Show packages
        run: |
          find packages -type f -maxdepth 1 -print

      - name: Upload Lantern deb
        uses: actions/upload-artifact@v4
        with:
          name: Lantern
          path: packages/*.deb
          if-no-files-found: error
