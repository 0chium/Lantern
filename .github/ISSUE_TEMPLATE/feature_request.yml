name: Feature request
description: Suggest a focused improvement to Lantern.
title: "[Feature] "
body:
  - type: textarea
    id: request
    attributes:
      label: Requested feature or behavior
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Problem or use case
      description: What would this help you do?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe how you expect it to work in normal use.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional examples or attachments.
    validations:
      required: false
